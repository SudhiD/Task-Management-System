<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager - Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .login-box {
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Task Manager</h2>
        <h3>Login</h3>

        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">Login</button>

        </form>

        <p id="message"></p>

        <p>
            Don't have an account?
            <a href="register.html">Register</a>
        </p>

    </div>


    <script>

        document.getElementById("loginForm").addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const username =
                    document.getElementById("username").value;

                const password =
                    document.getElementById("password").value;


                try {

                    const response = await fetch(
                        "http://127.0.0.1:8000/api/users/login/",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                username: username,
                                password: password
                            })
                        }
                    );


                    const data = await response.json();

                    console.log(data);


                    if (response.ok) {

                        localStorage.setItem(
                            "token",
                            data.token
                        );

                        window.location.href =
                            "tasks-list.html";

                    } else {

                        document.getElementById(
                            "message"
                        ).innerText =
                            JSON.stringify(data);

                    }

                } catch (error) {

                    console.error(error);

                    document.getElementById(
                        "message"
                    ).innerText =
                        "Unable to connect to server.";

                }

            }
        );

    </script>

</body>

</html>
